name: Despliegue provisional (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar URL de API para SQL Server
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Configure el secret VITE_API_URL en GitHub (Settings → Secrets → Actions)."
            echo "Sin ese secret, GitHub Pages seguira sin conectar a SQL Server."
          else
            echo "API configurada para el build de produccion."
          fi

      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /inh-control-predios/
          VITE_USE_API: 'true'
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
